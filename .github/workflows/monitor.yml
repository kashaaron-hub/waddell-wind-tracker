name: Waddell Wind Monitor

on:
  schedule:
    - cron: '*/15 * * * *'  # Automatically runs every 15 minutes 24/7
  workflow_dispatch:        # Allows you to manually trigger a test run anytime

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Monitor
        run: python monitor.py
