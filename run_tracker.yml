name: Waddell Wind Monitor Tracker

on:
  schedule:
    - cron: '*/15 * * * *'  # Runs automatically every 15 minutes 24/7
  workflow_dispatch:        # Allows you to click "Run workflow" manually to test it

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4  # Upgraded to v4 to fix deprecation warning

      - name: Set up Python
        uses: actions/setup-python@v5  # Upgraded to v5 to fix deprecation warning
        with:
          python-version: '3.10'

      - name: Run Monitor
        run: python monitor.py
